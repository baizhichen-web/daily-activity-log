selfEval:
  intro: 'Self-assessment is never easy — it is genuinely hard to describe oneself accurately. For this section I dug through four years of quarterly ideological reports, probably the most frequent self-examination I have ever done. In one of them I wrote:'
  quotes:
    - 'Model Making – 76. Weak hands-on skills and little patience; I also failed to apply pattern-making and testing properly in later design work.'
    - 'Computer-Aided 3D Design – 84. I grew complacent after some early modelling knowledge, showed the course too little respect, and never trained my modelling ability to a decent standard.'
  body:
    - short: 'This is someone with poor hands-on skills, someone impatient, someone who loses interest in three minutes, someone who fears effort and difficulty, someone forever setting goals, someone who likes to be clever.'
      full: 'Much of it was noise. So let me try to synthesise once more — this is someone with poor hands-on skills, someone impatient, someone who loses interest in three minutes, someone who fears effort and difficulty, someone forever setting goals, someone who likes to be clever.'
    - short: 'And this is someone who loves sport, someone who loves making things, someone bright and open, someone even-tempered, someone who longs to become honest and kind and morally upright — and who tries not to slide the other way.'
      full: 'But there is a corresponding good side — this is someone who loves sport, someone who loves making things, someone bright and open, someone even-tempered, someone who longs to become honest and kind and morally upright, and who tries not to slide the other way.'

