about:
  - 'I am 23. As an undergraduate I ranked first in my major by GPA and received the National Scholarship twice; I was recommended for admission to the School of Future Design at Beijing Normal University, where I now work on service design.'
  - 'Since starting university in 2022 I have been actively exploring where design, product and technology are heading. Meeting the world with curious eyes is, I think, my greatest strength.'
  - 'I spent my undergraduate years in a school of mechatronics and automation, which gave me a feel for both technology and industrial production — whether the principle holds, whether the structure is reliable, whether materials and processes match, whether cost and yield are under control, whether the supply chain and mass production are realistic.'
  - 'Design, in turn, gave me a product perspective — rational and sensory at once — from which to engage with technology.'
  - 'On the rational side, I turn “experience” into something observable, verifiable and iterable; I use data as a tool both inside the design process and to calibrate design decisions, and I give ideas physical form through hardware and code.'
  - 'On the sensory side, design puts technology back into human perception and lived experience. What does it feel like when it is seen, touched, operated? What emotion and meaning does it carry through form, material, sound, light and interaction? Does it make people want to come closer, to understand, to remember?'

beyond:
  intro: 'Beyond the major there are hobbies. I think hobbies shape a person — and a person, almost without noticing, chooses their hobbies. Interests matter a great deal: they make us happy, and they nourish us, carrying us out of difficulty when things hurt.'
  items:
    - title: 'Football'
      text: 'I played for the university football team throughout my undergraduate years, training and competing regularly. Sport gave me health, joy and a tougher will.'
    - title: 'Reading & Writing'
      text: 'Reading keeps my curiosity about the world alive. I take books in, read widely, absorb and discard — and end up with a great deal I want to say. Writing then helps me turn those vague thoughts into clear expression.'
    - title: 'Calligraphy'
      text: 'I keep writing the characters earlier hands have written, feeling out the movement and the curves of traditional culture in every stroke — an inexhaustible source of traditional aesthetics for me. In truth, though, I am a calligraphy enthusiast whose eye outruns his hand.'
    - title: 'Tech communities'
      text: 'I follow the large-model community closely and enjoy watching new techniques turn into small, usable tools. In 2023 I trained and shared models on Civitai and Liblib, ranking among the top 100 new creators on Civitai; my Liblib models have drawn 1.4k+ downloads and 14k+ online runs. These communities keep me sensitive to where things are going.'

