title: 圆周旅迹在顺德的三天两夜
slug: shunde-lvxing
date: "2026.07"
kind: 游记
accent: "#b3402e"
summary: 「知太多了，不知道如何去行」——带舍友去顺德的三天两夜，也把圆周旅迹当作一个产品认真拆了一遍：发心、定位、不可能三角与三个错位。
calligraphy:
  image: /media/writing/shunde-lvxing/calli.webp
  imgAspect: 2.5494
  cropFrom: '5.88,0.0,93.17,100.0'
  cropTo: '9.73,3.21,27.23,77.43'
  chars: 旅迹
body:
  - type: paragraph
    text: 「读万卷书，行万里路」，古人把「行」和「读」并列，意思是光看书不够，还得亲自走一走，担心的是读得太多、走得太少。四百年后，有了小红书、Bilibili、抖音，「读万卷书」变成了「刷万条笔记」，「知者行之始，行者知之成」，我们反倒陷入了另一种困境：知太多了，不知道如何去行。
  - type: paragraph
    text: 小红书收藏了多少攻略，B站存了多少视频，抖音群里互相分享，地图上密密麻麻都是想去的地点。我们不知道怎样把这些地点连成一条路线。
  - type: paragraph
    text: 我感觉这是旅行产品真正应该解决的问题——它真正售卖的不该是酒店、机票或门票，而是把纷乱的信息收束成一条能够出发的路径。
  - type: paragraph
    text: 所以，当我准备和舍友去顺德旅行的时候，我认真用了圆周旅迹。
  - type: heading
    level: h2
    text: 一、圆周旅迹是一个怎样的软件？
  - type: heading
    level: h3
    text: 发心第一
  - type: quote
    text: '"一位搞设计出身的P人因为市面上没有简单好用的旅行规划产品，决定自己做一个。TA胆子很大，我们也壮着胆子跟了进来。圆周旅迹就是这样简单开始的，确切地说是小圆周，一个成长中的旅行规划App和一群边探索世界边学习如何做好圆周旅迹的我们。"'
    source: 圆周旅迹开发者
  - type: paragraph
    text: 他们做产品的爱说发心，儒家的产品人就里讲：「知止而后有定，定而后能静」，强调的就是发心第一，所谓产品的气质，很大程度上就藏在它最初的发心里。
  - type: paragraph
    text: 作为一个对产品设计感兴趣的人，我被圆周旅迹的发心打动了。确实像他们说的一样，每次出发前的状态是Resfeber——兴奋与恐惧同时涌入身体：兴奋是因为要去一个新地方，恐惧是因为不知道会遇到什么。我期待把这样的兴奋融进恐惧里，把我的旅行变得井井有条。
  - type: paragraph
    text: 但实话说，更多打动我的还有这个产品的UI设计。以及他在小红书上有意思的营销策略。
  - type: gallery
    images:
      - image: /media/writing/shunde-lvxing/fig-01.webp
        caption: 该产品的UI设计（来源：圆周旅迹小红书）
      - image: /media/writing/shunde-lvxing/fig-02.webp
        caption: 有趣的功能策划与营销（来源：圆周旅迹小红书）
  - type: heading
    level: h3
    text: 定位第二
  - type: paragraph
    text: 从「为旅行提供完整计划、易用路径和未知惊喜」的发心出发，我们讨论其定位。产品的定位其实可以拆为一系列定位：
  - type: paragraph
    text: "**用户定位——「为谁」**"
  - type: paragraph
    text: 18-35岁、偏好自由行、希望高效完成旅行规划的年轻旅行者；不想花大量时间做攻略的「懒人旅行者」；多人出行场景中的行程组织者。这群人习惯从社交平台收集信息，但不信任平台的部分攻略。
  - type: paragraph
    text: "**场景定位——「在哪用」**"
  - type: paragraph
    text: 旅行规划全周期：灵感收集阶段（从小红书等平台「抄作业」）、行程规划阶段（AI生成路线与多人协作）、出行执行阶段（地图导航与动态调整）
  - type: paragraph
    text: "**价值定位——「解决什么问题」**"
  - type: paragraph
    text: 攻略信息散落各处、手动整理费时费力；景点路线不知如何串联最合理；多人出行沟通成本高、信息不同步；「刷万条笔记」却难成一份可出发的行程。
  - type: paragraph
    text: "**竞争定位——「为什么是我们」**"
  - type: paragraph
    text: 纯规划工具，不做预订、不接机票酒店销售；一键解析小红书/公众号链接自动生成行程；AI根据地理位置自动排线，跨城接驳可靠性高；完全免费、无广告无内购——用「减法」建立信任。
  - type: paragraph
    text: 这样的定位是足够窄的，窄到不知道他的商业路径是什么样的。但同时也深：一键导入、地图自动排线、行程协作，这些在OTA（Online Travel
      Agency）平台里只是辅助工具，在它这里是核心体验。
  - type: paragraph
    text: 在一个什么都想做的互联网环境里，这种克制本身就是一种定位能力。「为道日损。损之又损，以至于无为」做学问是不断增加，做事情却往往是不断减少。产品也是如此。一个产品真正成熟的标志，不是功能越来越多，而是越来越清楚哪些事情应该留给别人去做。我们老说一句话：**不是决定自己做什么，而是决定自己不做什么。**但对于旅行来说，这够吗？
  - type: heading
    level: h2
    text: 二、设计第三
  - type: paragraph
    text: 定位回答的是「应该做什么」，真正困难的是「能不能做到」。Resfeber只是买完机票那一刻的情绪，而旅行是一个持续三天、七天甚至更长的过程。情绪会消退，剩下的是琐碎的决策：明天几点出门？先去A还是先去B？打车还是坐地铁？这些问题不会因为一个好idea就自动解决，重点是怎么实现。
  - type: paragraph
    text: 于是，我越来越怀疑，旅行规划本身是不是一个成立的产品命题。
  - type: heading
    level: h3
    text: 「不可能三角」
  - type: paragraph
    text: 圆周旅迹最吸引我的地方，在于它抓住了一个真实的需求——旅行前那堆琐碎的决策怎么来收束，这是一件很能让人获得成就感的事情
  - type: paragraph
    text: 只是，当一个产品试图解决这个问题时，它几乎必然会面对三个互相拉扯的目标。
  - type: paragraph
    text: 第一，为用户节约时间。
  - type: paragraph
    text: 第二，让规划真正有用。
  - type: paragraph
    text: 第三，让产品能够活下去。
  - type: paragraph
    text: <callout emoji="💡"> **但这三件事不可能同时做到最好。你选了其中两个，第三个就会打折扣。这就是产品的「不可能三角」。**
      </callout>
  - type: paragraph
    text: 如果希望用户一分钟生成一份路书，就必须依赖已有的数据；如果希望这份路书真正符合每个人，又不得不投入大量交互，让用户不断修正自己的偏好；如果还希望产品免费，就意味着商业化能力必然受到限制。
  - type: paragraph
    text: "**角一：个性化体验 vs 商业化变现**"
  - type: paragraph
    text: 旅行最迷人的地方是个性化体验，而不是标准化的网红打卡。这也是为什么我们越来越厌恶小红书上千篇一律的攻略，并且夹杂着软文广告。
  - type: paragraph
    text: AI旅行规划最大的卖点是「智能」推荐。但实际体验往往让人失望：无论是东山岛还是厦门岛，AI生成的行程无外乎网红景点加热门餐厅。它利用小红书或马蜂窝上那些带有营销性质的UGC内容，推荐高度雷同。
  - type: paragraph
    text: 波兰尼说：「我们知道的，总比能够说出来的更多。」（We know more than we can
      tell.）旅行正是如此。人对于一座城市的喜恶，大量来自那些无法数据化的默会知识：巷子里的烟火味，茶馆里的45折，骑楼下吹来的穿堂风。这些体验构成了旅行，却几乎无法成为AI的输入。
  - type: paragraph
    text: 我可以相信AI有极佳的逻辑推理能力，但我绝不相信AI有极佳的感知能力。即便是多模态模型，它有眼睛、有嘴巴、有耳朵，但它没有鼻子，没有触觉。永远不知道怎么感受和体验旅行中误打误撞的美。
  - type: paragraph
    text: 用户真正需要的是独特的体验，AI能提供的是大众的均值——是大数据算出来的「大多数人会选」。
  - type: paragraph
    text: 但这背后是个死结：做旅游产品不能只做小众，因为小众太难变现。网红打卡点之所以被反复推荐，是因为它们能带来商业回报。免费露营地、地道苍蝇馆子——推荐这些怎么变现？不变现平台活不下去。收用户的钱？大多数旅行者已经习惯了免费。
  - type: paragraph
    text: 规划越千人千面，越难盈利；规划越标准化，用户越觉得不够好。
  - type: paragraph
    text: "**角二：规划的复杂性 vs 技术的有限性**"
  - type: paragraph
    text: 产品很勾引我的是AI规划的功能。
  - type: paragraph
    text: 面对着导入地点之后纷乱复的地图，我们要怎么规划？我看到了他的 AI
      规划，我天真地想，他是不是能有理有据地帮我规划一下？可能是按照我的喜好，可能是按照交通便捷程度。
  - type: paragraph
    text: 不得不说做 AI 产品的，都希望 AI
      能从海量的消息（可能是日程、兴趣或收藏等软件的上下文）中，把「应该做的」和「应该去的」摘出来，进行汇总和「智能」分析。这是AI的一个应用方向。
  - type: paragraph
    text: 但是，AI完成的规划完全在我想象之外。他一天为我安排了三四个地点，而且精准地分为了早、中、晚。他完全不知道我一个中午能去吃 3
      趟，我能去完清晖园，然后去金榜街。
  - type: paragraph
    text: 一天可能要玩七八个地点，它只能自动规划四五个。
  - type: paragraph
    text: 「郑人买履」，宁可信尺，不信其足。后来的人把它当笑话，现在看来，AI旅行规划何尝不是另一种郑人买履？它相信地图，相信距离，却从没问过我的想要啥。
  - type: paragraph
    text: 这不是功能缺失，是技术限制——目前AI主要做的是「出发地→目的地」的长线规划，但真实高频需求发生在目的地内部的「景点→景点」之间。这背后涉及的交通方式、时间、路线，主要通过对地图信息的调用实现，技术上并不困难，难点在于平台利益分配：OTA平台和出行平台，谁有资格去呈现这个答案。
  - type: paragraph
    text: 理想情况下，Agent可以为用户自动处理预订机票、住宿、门票等涉及支付的决策。但这些费用高度变化，在充满不稳定性和模糊性的环境中，Agent如何为用户做出最优解？如何明确Agent的决策边界、防止越权决策？这些才是旅行类AI产品的核心难题，也是目前几乎没有产品真正解决好的地方。
  - type: paragraph
    text: 更底层的问题是：用户自己都不完全清楚自己的喜好。一个不稳定的输入，不可能产生稳定的输出。因此，AI与用户信息的渐进式交互设计尤为重要——需要把用户的出行偏好和意图，设计成一个可以被生成、被修改、被否定的场景。但目前市面上，我没有看到任何一款AI旅行产品将设计重点放在这里。
  - type: paragraph
    text: 不管是什么人，都很难在出发前确定「我就是要这样玩」。旅行规划本质上是个伪命题——没人能提前锁定全部行程。
  - type: paragraph
    text: 所谓规划，往往是提前规划「一部分」，剩下的留到旅行中机动。对「一部分」具体是多少、怎么留白、怎么应对变化，目前的这个产品的设计还没有很好的答案。
  - type: paragraph
    text: 同时，真实的旅行决策是逐段发生的：从A到B是步行还是打车，从B到C要不要改计划，天气变了要不要换路线。这些不是一次AI生成就能解决的问题。AI在产品中需要有「规划—执行—调整」的闭环，但目前的技术和产品设计都很难同时做到「多快好省」。
  - type: paragraph
    text: 这里的核心矛盾在于——人的决策是非线性、渐进式、受当日情绪和环境影响的，真正的旅行，总是在不断修正计划：天气变了，路线变了；饭吃多了，计划变了；偶然遇见一家小店，计划又变了。而既定的路书是线性的、一次性的、提前锁定的，需要有可以转圜、灵活的路书，而这样时刻响应的功能我认为是AI擅长的，只是还没有发挥出来。
  - type: paragraph
    text: "**角三：无耻的盈利**"
  - type: paragraph
    text: 如果旅行本身充满变化，那么最稳定的，反而是交易。
  - type: paragraph
    text: 酒店要订，机票要买，门票要支付。这些都是确定性的需求。
  - type: paragraph
    text: 因此，OTA天然拥有比任何独立旅行规划工具更大的优势。它掌握着用户，也掌握着商家，更掌握着交易本身。AI规划，不过是在交易链路上增加一个新的入口。
  - type: paragraph
    text: 而圆周旅迹选择了另一条路。
  - type: paragraph
    text: 它放弃了酒店、机票和广告，把几乎所有精力都放在规划本身：攻略导入、地图排线、多人协作、免费使用。这是一种很克制的产品定位。
  - type: paragraph
    text: 用户也不断在App Store评论里提醒开发团队：「不要广告，不要内购，保持现在这样。」
  - type: paragraph
    text: 只是，任何克制都意味着代价。圆周旅迹选择了简洁，也选择了免费；那么，它必须接受另一件事情：规划深度，很难做到真正意义上的「智能」。
  - type: paragraph
    text: 或许，这并不是圆周旅迹的问题。而是旅行本身的问题。
  - type: heading
    level: h2
    text: 三、三个错位
  - type: paragraph
    text: 还有一些其他的功能问题。
  - type: heading
    level: h3
    text: 攻略导入：从来是拼凑
  - type: paragraph
    text: 它能从小红书导入攻略链接，自动解析地点并生成行程。但它的逻辑是「整条链接导入」——你复制一个链接，它把整篇攻略变成一条路径。
  - type: paragraph
    text: 问题是，我做攻略的方式不是这样的。我对小红书的推荐内容往往半信半疑，不可能把整个链接复制过来完整使用。往往是小红书收藏一点，B站看一点，YouTube补一点，再加上本地朋友一句「那家店别去了」，最后才慢慢拼出自己的路线。真正的攻略，更像一副拼图，而不是一篇文章。实际上我是一个一个地去搜地名，然后根据它们的远近关系把它们组合起来。
  - type: paragraph
    text: 但这个App没有这样的功能——它假设你的信息来源是「一条完整的攻略」，但真实场景是「碎片化信息的重组」。这不只是功能缺失，是产品假设与用户实际行为的错配。
  - type: paragraph
    text: 古人行路，没有攻略，靠的是「问路」。「借问酒家何处有，牧童遥指杏花村。」一问一指，路径就有了。今天我们的「问路」变成了刷信息流，但信息太多，大量中肯、真诚的信息被淹没在更多的软文广告之中。反而不知道该听谁的。
  - type: paragraph
    text: 所以，问题不在于圆周旅迹不会导入攻略，而在于它假设信息天然就是完整的；现实却恰恰相反，旅行信息几乎永远是碎片化的。
  - type: heading
    level: h3
    text: 交通规划：决策不是范围，而是情境
  - type: paragraph
    text: 它不能为某个地点到某个地点的行程规划不同的交通工具。它设定的是一个范围：1公里以内用偏好什么交通，1公里以上用什么交通。
  - type: paragraph
    text: 但旅行中的交通决策是「这段路怎么走」，不是「1公里以内怎么走」。从A到B可能步行，从B到C可能打车，从C到D可能地铁——每段路的决策逻辑不同。产品的粒度设定（范围）和用户的决策粒度（逐段）不匹配。
  - type: paragraph
    text: 「权，然后知轻重；度，然后知长短。」真正的交通决策，从来不是一条固定规则，而是每一段路都重新权衡一次。
  - type: paragraph
    text: 机器按规则思考，用户按情境思考。
  - type: heading
    level: h3
    text: 地点排序：好的交互，不应该依赖说明书
  - type: paragraph
    text: 排序操作很麻烦，需要把地点先清出去再加进来，这样它就会被加到最后一个位置。旅行规划中，地点顺序调整是高频操作——「先去A还是先去B」。当调整顺序的成本高于重新规划的成本时，用户会放弃排序。
  - type: paragraph
    text: （我写这篇文章的时候才知道地点可以长按并拖动。这是一个示能设计的问题，用户无法凭直觉发现这个操作。）
  - type: paragraph
    text: 一个好的设计，不应该要求用户先阅读说明书，再理解产品；而应该让正确的操作，本身就能够被看见。
  - type: paragraph
    text: 如果一个高频功能，需要用户偶然发现，它在体验上就等于不存在。
  - type: paragraph
    text: （可以借鉴高德，以三条横杠并列来表示可以拖动调整）
  - type: figure
    image: /media/writing/shunde-lvxing/fig-03.webp
  - type: heading
    level: h2
    text: 四、顺德三天两夜
  - type: paragraph
    text: 6月24号周三晚上在广州南下车，在佛山和广州交界处吃了一顿农庄烧鹅，就直奔顺德
  - type: paragraph
    text: 要是AI能和我讨论先去顺德好还是先去广州好，或许会改变我所订的酒店。也会改变后续我一系列的规划决策
  - type: paragraph
    text: 农庄餐厅来自本地人的推荐，而住的酒店我又在华住旗下预定（因为有企业铂金），又在小红书、B站、抖音的各种探店视频中，预定了各种各样要去踩点探店的美食。最后再看旁边有没有什么景点可以逛一逛，供消食作用。
  - type: paragraph
    text: 计划几乎随时都在变化。
  - type: paragraph
    text: 酒店早餐比想象中丰盛，一路上小吃就吃不了那么多；鱼生的分量远超预期，原本计划好的桑拿鸡，只能推迟到晚上；为了消食，我们临时打车去了顺峰山公园，骑车绕着公园转了一圈又一圈。今天想多吃一家店，明天想多逛一条街；天气变了，计划变了；同行的人一句「要不算了」，计划又变了。旅行从来不是执行计划，而是在不断修改计划。
  - type: paragraph
    text: 所以说，在整个旅行过程中，我并没有很受益于系统带给我的规划功能——
  - type: paragraph
    text: 找路，我还是打开高德；打车，我还是打开滴滴。真正让我不断回到圆周旅迹的，并不是它的规划能力，而是记录能力。到了一个景点，我会顺手补上照片，写下价格，记一句评价；吃完一家店，我会把味道、排队时间、是否值得再来，悄悄写进行程里。
  - type: paragraph
    text: 后来翻看地图，那些原本只是一个个地点，被轨迹重新连成了一次完整的旅行。真正留下来的，不是AI生成的路书，而是一路走下来不断修改、不断补充、不断记录的痕迹。
  - type: paragraph
    text: 《浮生六记》里，沈复写芸娘生动，正因为那些细碎的日常，后来读来才觉得真实。旅行或许也是这样。规划回答的是「我要去哪」，记录回答的却是「我曾经怎样到过那里」。
  - type: gallery
    images:
      - image: /media/writing/shunde-lvxing/fig-04.webp
      - image: /media/writing/shunde-lvxing/fig-05.webp
      - image: /media/writing/shunde-lvxing/fig-06.webp
  - type: heading
    level: h2
    text: 五、我的期待
  - type: paragraph
    text: 抛开其他不谈，这个软件可以称得上是一个比较好的记录软件。
  - type: paragraph
    text: 规划功能有以上问题，但用它来记录旅行反而意外地好用。你去了哪些地方，App会自动记录轨迹。切换到地图视图，每天的路线以连线形式呈现，一眼能看出走了什么路线。同行好友一直让我把行程地图发他，可是我只能截图，在功能中行程可以复制链接发给微信好友。但是这样的分享是否需要跨越重重平台？是否有更轻量化的分享方案和呈现手段？是否支持更灵活的长图定制、支持导出为PDF或Markdown？
  - type: paragraph
    text: "**人们并不是购买一把钻头，而是购买一个洞。**"
  - type: paragraph
    text: 同样，人们规划旅行，有没有可能是为了分享这次井井有条的旅行。——它可能会成为一个非常好的旅行记录工具。规划是它想做的，记录是用户实际在用的。两者之间的落差本身就是产品洞察。
  - type: paragraph
    text: 所以说，在现在有的产品的基础上，这边不是一个好的旅行规划产品，那是不是能够强化它的记录属性？
  - type: paragraph
    text: 如何实时地来规划？
  - type: paragraph
    text: 如何渐进式地、随时随地地和用户讨论他的计划？
  - type: paragraph
    text: 如何把自己对景点、对美食、对地区的锐评加在我们的行程当中？
  - type: paragraph
    text: 让我们导出的图像或者说文件格式更易于分享和记录？
  - type: paragraph
    text: 有没有一个更完善更美好的UGC社区，来做种草
  - type: paragraph
    text: 在我不成熟的想法上，我们的三角应该怎么解决？那就是我们做轻规划，我们做重记录。
  - type: paragraph
    text: 用「记录 + 发现」试图同时解三角
  - type: paragraph
    text: 通过一个旅行种草社区来做**产品盈利**
  - type: paragraph
    text: 通过轻量的产品架构（无机票、酒店等等）和突出的线路规划功能来确保**规划质量并为用户节约时间**
  - type: heading
    level: h3
    text: 「不可能三角」的解法
  - type: paragraph
    text: 回到那个「不可能三角」：省时间、盈利、规划质量，三件事不可能同时做到最好。
  - type: paragraph
    text: 但问题可能出在「规划」这个词上。旅行规划本质上是个伪命题——没有人能提前确定「我就是要这样玩」。规划只能覆盖「一部分」，剩下的必须在旅行中机动。如果规划天然是不稳定的，那么产品就没有必要执着于提供一份永远正确的答案。把规划做轻，好好做一个好用的旅行记录软件就好。
  - type: paragraph
    text: "**所谓轻规划，并不是放弃规划，而是承认规划终究只是旅行的「一部分」；所谓重记录，也不是旅行结束以后才开始记录，而是让记录成为旅行本身。**"
  - type: paragraph
    text: 「方生方死，方死方生。」旅行也是如此。计划在不断失效，记录却在不断生成。
  - type: paragraph
    text: "**或许，一款真正好的旅行产品，不应该试图替用户安排未来，而应该帮助用户理解已经发生的一切。**"
  - type: heading
    level: h2
    text: 六、结尾
  - type: paragraph
    text: 「泉涸，鱼相与处于陆，相呴以湿，相濡以沫，不如相忘于江湖。」
  - type: paragraph
    text: 攻略也是如此。离开了具体的时间、天气、同伴和身体感受，再精致的攻略，也不过是岸上的鱼沫。真正的旅行，从来不是复制别人的路径，而是在不断偏离计划中完成自己的路径。
  - type: paragraph
    text: 规划永远发生在旅行之前，记录却发生在旅行之中。前者试图预测未来，后者忠实保存已经发生的一切。一个面向「还没有发生」，一个面向「已经发生」。
  - type: paragraph
    text: 旅行往往也是谋事在人，成事在天，真正让人感动的，也往往是那些没法提前计划的东西。规划功能是它花了大力气做的「有用之用」，但真正留住我的是它没设计到的记录功能，「无用之用，方为大用」。
  - type: paragraph
    text: <callout emoji="✨"> **迟来的规划再加上我顺手拍的照片和随口写的评价，成了我这三天的旅行。** </callout>
